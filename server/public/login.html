<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - تقارير الحضور</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#16212e">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الحضور">
<style>
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    font-family: Tahoma, "Segoe UI", Arial, sans-serif; background:#f4f6f8; color:#1d2733; }
  .box { background:#fff; border:1px solid #e3e7eb; border-radius:14px; padding:26px 22px; width:min(380px, 100%); text-align:center; }
  img { width:72px; height:72px; border-radius:16px; }
  h1 { font-size:20px; margin:14px 0 4px; }
  p { color:#6b7682; font-size:13px; margin:0 0 18px; line-height:1.7; }
  input { width:100%; padding:12px; font-size:16px; border:1px solid #e3e7eb; border-radius:8px; margin-bottom:12px; text-align:center; }
  button { width:100%; padding:12px; font-size:16px; border:0; border-radius:8px; background:#1f6feb; color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; }
  #err { color:#c62828; font-size:14px; min-height:20px; margin-top:10px; }
  #demo { margin-top:14px; border-top:1px dashed #e3e7eb; padding-top:12px; font-size:13px; color:#6b7682; }
  #demo button { background:#fff; color:#1d2733; border:1px solid #e3e7eb; padding:8px; font-size:14px; margin-top:6px; }

</style>
</head>
<body>
<form class="box" id="f">
  <img src="/icon-192.png" alt="">
  <h1 id="title">تقارير الحضور</h1>
  <p id="sub">ادخل باسم المستخدم وكلمة السر</p>
  <input id="user" autocomplete="username" placeholder="اسم المستخدم" autocapitalize="none" autocorrect="off" spellcheck="false" dir="auto" required>
  <input type="password" id="pw" autocomplete="current-password" placeholder="كلمة السر" required>
  <input type="password" id="pw2" autocomplete="new-password" placeholder="أعد كتابة كلمة السر" hidden>
  <button id="btn">دخول</button>
  <div id="err"></div>
  <div id="demo" hidden></div>
</form>
<script>
const $ = (id) => document.getElementById(id);
let setup = false;
try { $('user').value = localStorage.getItem('zkLastUser') || ''; } catch (_) {}
(async () => {
  try {
    const j = await (await fetch('/api/session')).json();
    if (j.user) return location.replace('/');
    if (j.setup) {
      setup = true;
      $('title').textContent = 'أول تشغيل: حساب الصلاحية المطلقة';
      $('sub').textContent = 'أنشئ أول حساب: صلاحية مطلقة بدون قيد، ويضيف كل أنواع المستخدمين (مدير، مشرف، أساسي، موظفين).';
      $('user').value = '';
      $('pw').placeholder = 'كلمة السر (6 أحرف أو أكثر)';
      $('pw').autocomplete = 'new-password';
      $('pw2').hidden = false; $('pw2').required = true;
      $('btn').textContent = 'إنشاء الحساب والدخول';
    }
    if (j.demo && j.demoAccounts) {
      const labels = { super: 'صلاحية مطلقة', admin: 'مدير', supervisor: 'مشرف', viewer: 'أساسي', employee: 'موظف' };
      $('demo').innerHTML = 'وضع التجربة: اختار حساب حتى تجرب صلاحيته' +
        j.demoAccounts.map(a => `<button type="button" data-u="${a.username}" data-p="${a.password}">${labels[a.role] || a.role}: ${a.username} / ${a.password}</button>`).join('');
      $('demo').hidden = false;
      $('demo').onclick = (e) => { const b = e.target.closest('button'); if (b) { $('user').value = b.dataset.u; $('pw').value = b.dataset.p; } };
    }
  } catch (_) {}
  ($('user').value ? $('pw') : $('user')).focus();
})();
$('f').onsubmit = async (e) => {
  e.preventDefault();
  const btn = $('btn'), err = $('err');
  err.textContent = '';
  const user = $('user').value.trim(), pw = $('pw').value;
  if (!user || !pw) { err.textContent = 'اكتب اسم المستخدم وكلمة السر'; return; }
  if (setup && pw !== $('pw2').value) { err.textContent = 'كلمتين السر غير متطابقة'; return; }
  btn.disabled = true;
  try {
    const r = await fetch(setup ? '/api/setup' : '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pw }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'خطأ');
    try { localStorage.setItem('zkLastUser', user); } catch (_) {}
    location.replace('/');
  } catch (x) {
    err.textContent = x.message === 'Failed to fetch' ? 'ما گدرت أتصل بالبرنامج' : x.message;
    btn.disabled = false;
  }
};
</script>
</body>
</html>
