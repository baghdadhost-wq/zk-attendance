<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - تقارير الحضور</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0d3b3c">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الحضور">
<link rel="stylesheet" href="/theme.css">
<style>
  body { min-height:100vh; min-height:100dvh; display:grid; grid-template-columns:minmax(0, 1.1fr) minmax(380px, 1fr); }
  .side { position:relative; overflow:hidden; background:var(--ink) var(--ridges) no-repeat; background-size:min(900px, 120%); background-position:center 120%;
    color:#fff; display:flex; flex-direction:column; justify-content:space-between; padding:clamp(24px, 5vw, 64px); border-inline-end:4px solid var(--brass); }
  .side .mark { display:flex; align-items:center; gap:12px; font-weight:600; color:#cfe2dc; }
  .side .mark img { width:44px; height:44px; border-radius:12px; box-shadow:0 0 0 1px rgba(255,255,255,.14); }
  .side h2 { font-family:var(--display); font-weight:600; font-size:clamp(34px, 4.4vw, 60px); line-height:1.25; margin:0; word-spacing:.15em; max-width:12ch; }
  .side .now { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  .side .now b { font-family:var(--display); font-weight:500; font-size:clamp(56px, 8vw, 112px); line-height:1; direction:ltr; font-variant-numeric:tabular-nums; }
  .side .now b i { font-style:normal; color:var(--brass); animation:tick 2s steps(1) infinite; }
  .side .now span { color:#a9c6bf; font-size:15px; }
  @keyframes tick { 50% { opacity:.25; } }
  .wrap { display:flex; align-items:center; justify-content:center; padding:32px 20px; }
  .box { width:min(380px, 100%); }
  .box img { display:none; }
  h1 { font-weight:700; font-size:24px; color:var(--ink); margin:0 0 6px; }
  p { color:var(--muted); font-size:13.5px; margin:0 0 22px; line-height:1.7; }
  input { width:100%; padding:12px 14px; font-size:16px; min-height:48px; margin-bottom:12px; background:#fff; }
  button { width:100%; min-height:48px; font-size:16px; }
  #btn { background:var(--ink-2); border-color:var(--ink-2); color:#fff; font-weight:600; margin-top:4px; }
  #btn:hover { background:var(--ink-3); }
  #err { color:var(--bad); font-size:14px; min-height:20px; margin-top:12px; }
  #demo { margin-top:16px; border-top:1px dashed var(--line); padding-top:14px; font-size:13px; color:var(--muted); }
  #demo button { min-height:40px; font-size:14px; margin-top:6px; }
  @media (max-width:820px) {
    body { grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    .side { border-inline-end:none; border-bottom:3px solid var(--brass); padding:18px 20px 20px; gap:14px; background-size:520px; background-position:left -160px center; }
    .side h2 { font-size:24px; max-width:none; }
    .side .now b { font-size:40px; } .side .now span { font-size:13px; }
    .wrap { align-items:flex-start; padding:26px 18px 32px; }
  }
</style>
</head>
<body>
<aside class="side" aria-hidden="true">
  <div class="mark"><img src="/icon-192.png" alt="">جهاز البصمة</div>
  <h2>تقارير الحضور والانصراف</h2>
  <div class="now"><b id="clk">--:--</b><span id="clkD"></span></div>
</aside>
<div class="wrap">
<form class="box" id="f">
  <img src="/icon-192.png" alt="">
  <h1 id="title">تقارير الحضور</h1>
  <p id="sub">ادخل باسم المستخدم وكلمة السر</p>
  <input id="user" autocomplete="username" placeholder="اسم المستخدم" autocapitalize="none" autocorrect="off" spellcheck="false" dir="auto" required>
  <input type="password" id="pw" autocomplete="current-password" placeholder="كلمة السر" required>
  <input type="password" id="pw2" autocomplete="new-password" placeholder="أعد كتابة كلمة السر" hidden>
  <button id="btn">دخول</button>
  <div id="err"></div>
  <div id="demo" hidden></div>
</form>
</div>
<script>
const $ = (id) => document.getElementById(id);
let setup = false;
try { $('user').value = localStorage.getItem('zkLastUser') || ''; } catch (_) {}
(async () => {
  try {
    const j = await (await fetch('/api/session')).json();
    if (j.user) return location.replace('/');
    if (j.setup) {
      setup = true;
      $('title').textContent = 'أول تشغيل: حساب الصلاحية المطلقة';
      $('sub').textContent = 'أنشئ أول حساب: صلاحية مطلقة بدون قيد، ويضيف كل أنواع المستخدمين (مخصص وموظفين).';
      $('user').value = '';
      $('pw').placeholder = 'كلمة السر (6 أحرف أو أكثر)';
      $('pw').autocomplete = 'new-password';
      $('pw2').hidden = false; $('pw2').required = true;
      $('btn').textContent = 'إنشاء الحساب والدخول';
    }
    if (j.demo && j.demoAccounts) {
      const labels = { super: 'صلاحية مطلقة', custom: 'مخصص', employee: 'موظف' };
      $('demo').innerHTML = 'وضع التجربة: اختار حساب حتى تجرب صلاحيته' +
        j.demoAccounts.map(a => `<button type="button" data-u="${a.username}" data-p="${a.password}">${labels[a.role] || a.role}: ${a.username} / ${a.password}</button>`).join('');
      $('demo').hidden = false;
      $('demo').onclick = (e) => { const b = e.target.closest('button'); if (b) { $('user').value = b.dataset.u; $('pw').value = b.dataset.p; } };
    }
  } catch (_) {}
  ($('user').value ? $('pw') : $('user')).focus();
})();
$('f').onsubmit = async (e) => {
  e.preventDefault();
  const btn = $('btn'), err = $('err');
  err.textContent = '';
  const user = $('user').value.trim(), pw = $('pw').value;
  if (!user || !pw) { err.textContent = 'اكتب اسم المستخدم وكلمة السر'; return; }
  if (setup && pw !== $('pw2').value) { err.textContent = 'كلمتين السر غير متطابقة'; return; }
  btn.disabled = true;
  try {
    const r = await fetch(setup ? '/api/setup' : '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pw }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'خطأ');
    try { localStorage.setItem('zkLastUser', user); } catch (_) {}
    location.replace('/');
  } catch (x) {
    err.textContent = x.message === 'Failed to fetch' ? 'ما گدرت أتصل بالبرنامج' : x.message;
    btn.disabled = false;
  }
};

(() => {
  const DAYS = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
  const MONTHS = ['كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'تشرين الأول', 'تشرين الثاني', 'كانون الأول'];
  const p2 = (n) => String(n).padStart(2, '0');
  const tick = () => { const d = new Date(); $('clk').innerHTML = `${p2(d.getHours())}<i>:</i>${p2(d.getMinutes())}`;
    $('clkD').textContent = `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
